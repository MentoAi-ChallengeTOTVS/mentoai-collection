info:
  name: POST usuário
  type: http
  seq: 5

http:
  method: POST
  url: {{baseUrl}}/api/v1/usuarios
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nome": "Pedro Cunha Coutinho",
        "email": "{{email}}",
        "senha": "{{senha}}",
        "perfil": "DIRETOR_COMERCIAL"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
