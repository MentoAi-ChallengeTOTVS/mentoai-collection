info:
  name: Get Usuários
  type: http
  seq: 4

http:
  method: GET
  url: {{baseUrl}}/api/v1/usuarios
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
