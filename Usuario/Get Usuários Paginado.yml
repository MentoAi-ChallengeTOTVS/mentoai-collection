info:
  name: Get Usuários Paginado
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/api/v1/usuarios?page=0&size=5&sort=nome,asc
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "5"
      type: query
    - name: sort
      value: nome,asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
