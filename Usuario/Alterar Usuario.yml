info:
  name: Alterar Usuario
  type: http
  seq: 5

http:
  method: put
  url: {{baseUrl}}/api/v1/usuarios/{{usuarioid}}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "nome": "Banca FIAP",
        "email": "{{email}}",
        "senha": "{{senha}}",
        "perfil": "DIRETOR_COMERCIAL"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: usuarioid
      value: "7"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
