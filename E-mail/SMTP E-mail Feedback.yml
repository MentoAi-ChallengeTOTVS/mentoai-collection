info:
  name: SMTP E-mail Feedback
  type: http
  seq: 1

http:
  method: post
  url: {{baseUrl}}/api/v1/feedbacks
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nota": 5,
        "comentario": "Excelente copiloto comercial! Facilitou muito a rotina."
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
