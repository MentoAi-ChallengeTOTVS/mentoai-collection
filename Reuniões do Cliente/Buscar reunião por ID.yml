info:
  name: Buscar reunião por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/reunioes/{{reuniaoId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test("Status code válido", function () { expect(res.getStatus()).to.be.oneOf([200, 404, 500]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Busca uma reunião e retorna o clienteId associado. Resposta 200: {id, dataReuniao, duracaoMinutos, clienteId, usuarioId, criacao}. Pode retornar 404 ou 500. Sem autenticação."
