info:
  name: Listar reuniões do cliente
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/clientes/{{clienteId}}/reunioes"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code válido", function () { expect(res.getStatus()).to.be.oneOf([200, 404, 500]); });
        if (res.getStatus() === 200) {
          const json = res.getBody();
          if (Array.isArray(json) && json[0] && json[0].id) bru.setCollectionVar("reuniaoId", json[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Lista reuniões de um cliente. Resposta 200: array de {id, dataReuniao, duracaoMinutos, clienteId, usuarioId, criacao}. Retorna 404 quando o cliente não existe e 500 inesperado. O controller não aplica @Positive neste ID. Sem autenticação."
