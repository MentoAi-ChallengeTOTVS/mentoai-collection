info:
  name: GET ALERTAS
  type: http
  seq: 1

http:
  method: get
  url: {{baseUrl}}/api/v1/alertas?page=0&size=100&sort=criacao,desc
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "100"
      type: query
    - name: sort
      value: criacao,desc
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
