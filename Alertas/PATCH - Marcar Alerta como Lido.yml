info:
  name: PATCH - Marcar Alerta como Lido
  type: http
  seq: 3

http:
  method: patch
  url: {{baseUrl}}/api/v1/alertas/{{alertaid}}/lido
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: alertaid
      value: "20"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
