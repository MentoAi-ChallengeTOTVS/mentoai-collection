info:
  name: GET Detalhes do Alerta por ID
  type: http
  seq: 2

http:
  method: get
  url: {{baseUrl}}/api/v1/alertas/{{alertaid}}
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: alertaid
      value: "26"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
