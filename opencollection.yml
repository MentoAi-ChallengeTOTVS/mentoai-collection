opencollection: 1.0.0

info:
  name: MentoAi - Pedro
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: reuniaoId
      value:
        type: number
        data: "18"
    - name: transcricaoId
      value:
        type: number
        data: "18"
    - name: analiseId
      value:
        type: number
        data: "18"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
