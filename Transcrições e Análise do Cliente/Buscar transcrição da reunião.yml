info:
  name: Buscar transcrição da reunião
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/reunioes/{{reuniaoId}}/transcricao"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test("Status code válido", function () { expect(res.getStatus()).to.be.oneOf([200, 404, 500]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Busca a transcrição pela reunião associada ao cliente. Resposta 200: {id, conteudo, nomeArquivo, formatoArquivo, idioma, reuniaoId, criacao}. Pode retornar 404 ou 500. Sem autenticação."
