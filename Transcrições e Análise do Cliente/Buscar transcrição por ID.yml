info:
  name: Buscar transcrição por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transcricoes/{{transcricaoId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test("Status code válido", function () { expect(res.getStatus()).to.be.oneOf([200, 404, 500]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Busca uma transcrição vinculada à reunião de um cliente. Resposta 200: {id, conteudo, nomeArquivo, formatoArquivo, idioma, reuniaoId, criacao}. Pode retornar 404 ou 500. Sem autenticação."
