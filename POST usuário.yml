info:
  name: POST usuário
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/usuarios
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nome": "Thomaz Costa",
        "email": "thomazcosta@mentoai.com.br",
        "senha": "senhaSegura123",
        "perfil": "EXECUTIVO_COMERCIAL"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
