info:
  name: Atualizar cliente
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/clientes/{{clienteId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nome": "Clínica Saúde Integral",
        "segmento": "Saúde",
        "porte": "GRANDE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test("Status code válido", function () { expect(res.getStatus()).to.be.oneOf([200, 400, 404, 409, 500]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Substitui nome, segmento e porte do cliente. ID deve ser positivo; os três campos são obrigatórios e têm limites 255/100/50. Resposta 200: {id, nome, segmento, porte, criacao, status}. Pode retornar 400, 404, 409 ou 500. Sem autenticação."
