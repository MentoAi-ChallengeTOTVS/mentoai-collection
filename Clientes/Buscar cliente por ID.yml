info:
  name: Buscar cliente por ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/clientes/{{clienteId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test("Status code válido", function () { expect(res.getStatus()).to.be.oneOf([200, 400, 404, 500]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Busca um cliente por ID positivo. Resposta 200: {id, nome, segmento, porte, criacao, status}. Pode retornar 400 para ID não positivo, 404 quando inexistente e 500 inesperado. Sem autenticação."
