info:
  name: Consultar fila de análises
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/analises/fila"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test("Status code válido", function () { expect(res.getStatus()).to.be.oneOf([200, 500]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Consulta a fila e os itens finalizados, expondo clienteId e clienteNome. Resposta 200: {fila: [item], finalizados: [item]}, item = {analiseId, reuniaoId, clienteId, clienteNome, status, criadoEm, iniciadoEm, finalizadoEm, mensagemErro}. Pode retornar 500. Sem autenticação."
