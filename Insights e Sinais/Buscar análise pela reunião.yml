info:
  name: Buscar análise pela reunião
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/analises/reuniao/{{reuniaoId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test("Status code válido", function () { expect(res.getStatus()).to.be.oneOf([200, 404, 500]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Busca a análise pela reunião do cliente. A estrutura 200 é a mesma de Buscar análise por ID, incluindo insights e sinaisComerciais. Pode retornar 404 ou 500. Sem autenticação.
