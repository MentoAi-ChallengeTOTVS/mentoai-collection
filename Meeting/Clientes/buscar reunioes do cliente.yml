info:
  name: buscar reunioes do cliente
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/clientes/:id/reunioes"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
